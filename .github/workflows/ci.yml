name: CI

on:
    push:
    pull_request:

jobs:
    test:
        name: Typecheck, Unit Tests & Build
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Static type check (tsc)
              run: npx tsc --noEmit

            - name: Run Vitest test suite
              run: npm test

            - name: Compile userscript bundle
              run: npm run build

            - name: Verify committed userscript is in sync
              run: |
                  git diff --exit-code al-additions.user.js || (echo "ERROR: The root al-additions.user.js is out of sync with src/. Run 'npm run build' locally and commit the result." && exit 1)
