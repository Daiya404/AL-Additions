name: Bug report
description: Report a reproducible problem with AL Additions
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include access tokens, authorization codes, or other credentials."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
  - type: input
    id: script_version
    attributes:
      label: AL Additions version
      placeholder: "e.g. 0.6.1"
  - type: textarea
    id: logs
    attributes:
      label: Relevant error messages
      description: Remove tokens, codes, and personal information before posting.
